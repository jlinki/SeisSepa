defaults:
  - model: notebook
  - loss: separation
  - _self_

seed: 42
device: auto
threads: 4
train:
  epochs: 50
  batch_size: 128
  patience: 12
  grad_clip: 1.0
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0002
  weight_decay: 0.0001
wandb:
  project: seissepa-autoresearch
  entity: jlinki
  mode: online
  name: null

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  sweep:
    dir: outputs/sweeps/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
    subdir: ${hydra.job.num}
