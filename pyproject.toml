[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "seissepa-research"
version = "0.1.0"
description = "Fixed-data event/station representation research"
requires-python = ">=3.9,<3.13"
dependencies = [
  "torch==2.8.0",
  "numpy==2.0.2",
  "h5py==3.14.0",
  "scikit-learn==1.6.1",
  "hydra-core==1.3.2",
  "wandb==0.26.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
